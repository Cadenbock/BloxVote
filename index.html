<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>BloxVote - Vote for the Best Roblox Games</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <script>
      // Automatic recovery if browser cached an old index.html referencing missing JS/CSS bundle hashes
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var src = e.target.src || e.target.href;
          if (src && (src.includes('/assets/') || src.includes('index-'))) {
            var key = 'asset_reload_t';
            var lastReload = sessionStorage.getItem(key);
            var now = Date.now();
            if (!lastReload || (now - parseInt(lastReload, 10)) > 10000) {
              sessionStorage.setItem(key, now.toString());
              window.location.reload(true);
            }
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
